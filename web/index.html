const icon=(name)=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.star}</svg>`;
const cap=(v,low=0,high=100)=>Math.max(low,Math.min(high,v));
const fmt=(n)=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(Math.round(n));
const euro=(n)=>(n<0?'−':'')+fmt(Math.abs(n))+' €';
const rand=(ar)=>ar[Math.floor(Math.random()*ar.length)];
const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaultState(){return {version:VERSION,day:1,tick:0,playing:false,speed:1,sound:false,room:'reception',tab:'guests',cash:2450,reputation:34,security:74,ambience:66,characters:PERSONS.map(p=>({...p,skills:{...p.skills},busyUntil:0})),rooms:Object.fromEntries(KEYS.map(k=>[k,{level:1}])),waiting:[],jobs:[],log:[],guestSerial:1,arrived:0,served:0,missed:0,earned:0,spent:0,night:{earned:0,spent:0,served:0,missed:0},eventBag:[],seenEvents:[],overlay:null,eventResume:false,autosave:true};}
let state=defaultState();
try{const v=localStorage.getItem(SAVE_KEY);if(v){const p=JSON.parse(v);if(p&&p.version===VERSION&&p.rooms&&Array.isArray(p.characters)){state={...defaultState(),...p,playing:false,overlay:null,waiting:p.waiting||[],jobs:p.jobs||[]};}}}catch(e){console.warn('Spielstand nicht gelesen',e);}
function store(){try{const snap={...state,overlay:null,playing:false,eventResume:false};localStorage.setItem(SAVE_KEY,JSON.stringify(snap));}catch(e){console.warn('Speichern nicht möglich',e);}}
let toastTimer=0,toasts=[],audioCtx=null,previousRoom=state.room;
function notice(t){toasts.push({id:++toastTimer,text:t});if(toasts.length>3)toasts.shift();drawToasts();setTimeout(()=>{toasts.shift();drawToasts()},3000);}
function drawToasts(){let area=document.getElementById('toasts');if(area)area.innerHTML=toasts.map(t=>`<div class="toast" role="status">${safe(t.text)}</div>`).join('');}
function playTone(freq=440,duration=.1,vol=.025){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);osc.connect(g).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);}catch(_){}}
let noteIndex=0;setInterval(()=>{if(state.sound&&state.playing&&!state.overlay){const f=[220,261.6,293.7,329.6,293.7,261.6,246.9,196][noteIndex++%8];playTone(f,1.1,.012)}},1750);
function dayClock(){let hours=(18+Math.floor(state.tick/4))%24;return `${String(hours).padStart(2,'0')}:${String((state.tick%4)*15).padStart(2,'0')}`;}
function log(text){state.log.unshift({day:state.day,time:dayClock(),text});state.log=state.log.slice(0,80);}
function spawnGuest(){const t=rand(GUESTS),id='guest-'+state.guestSerial++;let guest={id,tid:t.id,name:rand(t.names),patience:t.patience,desc:rand(t.desc)};state.waiting.push(guest);state.arrived++;log(`${guest.name} (${t.type}) kommt ins Haus.`);}
function typeOf(g){return GUESTS.find(t=>t.id===g.tid)||GUESTS[0];}
function findStaff(t){return state.characters.filter(c=>c.room===t.room&&c.energy>=16&&c.busyUntil<=state.tick).sort((a,b)=>b.skills[t.skill]-a.skills[t.skill]||b.energy-a.energy)[0];}
function serve(id){const g=state.waiting.find(g=>g.id===id);if(!g){notice('Diese Anfrage ist nicht mehr verfügbar.');return;}const t=typeOf(g),r=state.rooms[t.room],staff=findStaff(t);if(!staff){notice('Kein verfügbares Teammitglied im Raum '+ROOM[t.room].short+'. Teamzuordnung prüfen.');state.tab='team';render();return;}
const ongoing=state.jobs.filter(j=>j.room===t.room).length;const capacity=t.room==='suite'?Math.max(1,r.level-0):2+Math.floor((r.level-1)/2);if(ongoing>=capacity){notice('Dieser Raum ist zurzeit belegt.');return;}
const payout=Math.round(t.base*(1+.18*(r.level-1))*(1+.045*(staff.skills[t.skill]-3))*(1+.004*(state.reputation-34)));
staff.energy=cap(staff.energy-(t.id==='vip'?19:12));staff.mood=cap(staff.mood+1);staff.busyUntil=state.tick+2;
state.jobs.push({guest:g.name,type:t.type,staff:staff.id,room:t.room,finish:state.tick+2,payout});state.waiting=state.waiting.filter(x=>x.id!==id);log(`${g.name} wird von ${staff.name} im Bereich ${ROOM[t.room].short} betreut.`);state.room=t.room;playTone(540,.12);notice('Buchung bestätigt · '+staff.name+' übernimmt.');store();render();}
function completeJobs(){const done=state.jobs.filter(j=>j.finish<=state.tick);state.jobs=state.jobs.filter(j=>j.finish>state.tick);for(const j of done){state.cash+=j.payout;state.earned+=j.payout;state.night.earned+=j.payout;state.served++;state.night.served++;state.reputation=cap(state.reputation+1);let worker=state.characters.find(c=>c.id===j.staff);if(worker)worker.mood=cap(worker.mood+1);log(`${j.guest}: Buchung abgeschlossen (+${euro(j.payout)}).`);playTone(680,.15);}}
function upkeep(){const levels=Object.values(state.rooms).reduce((a,x)=>a+x.level,0);const cost=Math.max(35,95+levels*6-(state.rooms.office.level-1)*13);state.cash-=cost;state.spent+=cost;state.night.spent+=cost;log(`Stündliche Personal- und Betriebskosten: −${euro(cost)}.`);for(const c of state.characters){if(c.room==='office')c.energy=cap(c.energy+6);else if(c.busyUntil<=state.tick)c.energy=cap(c.energy+3);if(c.energy<20)c.mood=cap(c.mood-2);}
if(state.cash<-200){state.reputation=cap(state.reputation-1);log('Anhaltende Liquiditätsprobleme belasten den Ruf.');}}
function tick(){if(state.tick>=40){nightEnd();return;}state.tick++;completeJobs();if(state.tick%3===0&&state.waiting.length<6)spawnGuest();if(state.tick%4===0){upkeep();for(const g of state.waiting)g.patience--;const leaving=state.waiting.filter(g=>g.patience<=0);for(const g of leaving){state.missed++;state.night.missed++;state.reputation=cap(state.reputation-1);log(`${g.name} verlässt das Haus ohne Buchung.`);}state.waiting=state.waiting.filter(g=>g.patience>0);}
if([4,14,24,34].includes(state.tick)){newEvent();}if(state.tick>=40){nightEnd();}store();render();}
function newEvent(){if(!state.eventBag.length){state.eventBag=EVENTS.map(e=>e.id).sort(()=>Math.random()-.5);}const id=state.eventBag.shift();const found=EVENTS.find(e=>e.id===id);state.seenEvents.push(id);state.eventResume=state.playing;state.playing=false;state.overlay={kind:'event',eventId:id};log(`Ereignis: ${found.title}`);playTone(370,.25);}
function applyEffects(effects){for(const [key,val] of Object.entries(effects)){if(key==='teamMood'){state.characters.forEach(c=>c.mood=cap(c.mood+val));}else if(key==='teamEnergy'){state.characters.forEach(c=>c.energy=cap(c.energy+val));}else if(['cash','reputation','security','ambience'].includes(key)){state[key]+=val;if(key!=='cash')state[key]=cap(state[key]);if(key==='cash'){if(val>0){state.earned+=val;state.night.earned+=val;}else {state.spent-=val;state.night.spent-=val;}}}}}
function chooseEvent(idx){const e=EVENTS.find(e=>e.id===state.overlay?.eventId);if(!e)return;let option=e.options[idx];if(!option)return;if(state.cash+(option.effects.cash||0)<0){notice('Für diese Entscheidung reicht das Guthaben nicht.');return;}applyEffects(option.effects);log(`${e.title}: ${option.label}.`);state.overlay=null;state.playing=state.eventResume;state.eventResume=false;playTone(600,.2);store();render();}
function nightEnd(){if(state.overlay?.kind==='summary')return;state.playing=false;completeJobs();state.overlay={kind:'summary'};log(`Nacht ${state.day} abgeschlossen · ${state.night.served} Buchungen.`);store();}
function nextNight(){state.day++;state.tick=0;state.waiting=[];state.jobs=[];state.night={earned:0,spent:0,served:0,missed:0};for(const c of state.characters){c.energy=cap(c.energy+30);c.mood=cap(c.mood+4);c.busyUntil=0;}for(let i=0;i<3;i++)spawnGuest();state.overlay=null;state.playing=false;state.room='reception';log('Das Team bereitet sich auf eine neue Nacht vor.');store();render();}
function upgrade(){const k=state.room,r=state.rooms[k],meta=ROOM[k];const price=Math.round(meta.base*Math.pow(1.65,r.level-1));if(r.level>=4){notice('Maximale Ausbaustufe erreicht.');return;}if(state.cash<price){notice('Nicht genügend Guthaben für diesen Ausbau.');return;}state.cash-=price;state.spent+=price;state.night.spent+=price;r.level++;state.ambience=cap(state.ambience+2);log(`${meta.short} auf Stufe ${r.level} ausgebaut (−${euro(price)}).`);playTone(520,.3);store();render();}
function switchRoom(key){if(!ROOM[key])return;state.room=key;previousRoom=key;playTone(330,.07);store();render();}
function assignStaff(id,k){if(k!=='off'&&!ROOM[k])return;const worker=state.characters.find(x=>x.id===id);if(!worker)return;if(worker.busyUntil>state.tick){notice(`${worker.name} ist noch in einer Buchung beschäftigt.`);render();return;}worker.room=k;worker.mood=cap(worker.mood+1);log(`${worker.name}: neuer Einsatzort ${k==='off'?'Pause':ROOM[k].short}.`);state.room=k==='off'?state.room:k;store();render();}
function exportSave(){const data=JSON.stringify({...state,playing:false,overlay:null},null,2),blob=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`velvet-hours-nacht-${state.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200);notice('Spielstand exportiert.');}

function teamPage(){return `<p class="sectionKicker">Dienstplan · ${state.characters.length} Erwachsene</p><div class="welcome">Ordne Teammitglieder den Räumen zu. Freie Mitarbeitende erholen sich in der Pause. Eine laufende Buchung kann nicht unterbrochen werden.</div>${state.characters.map(c=>`<div class="teamRow"><div class="avatar" data-action="profile" data-id="${c.id}" style="cursor:pointer">${personArt(c)}</div><div><div class="teamName">${c.name} <span style="font-weight:400;color:#aa99a5">(${c.age})</span></div><div class="teamInfo">${c.role} · Energie ${Math.round(c.energy)} % · Stimmung ${Math.round(c.mood)} % ${c.busyUntil>state.tick?'· beschäftigt':''}</div><select class="teamSelect" aria-label="Einsatzort für ${c.name}" data-action="assign" data-id="${c.id}" ${c.busyUntil>state.tick?'disabled':''}>${[...KEYS,'off'].map(k=>`<option value="${k}" ${c.room===k?'selected':''}>${k==='off'?'Pause / frei':ROOM[k].name}</option>`).join('')}</select></div></div>`).join('')}`;}
function historyPage(){return `<p class="sectionKicker">Chronik und Kennzahlen</p><div class="sideMetrics"><div class="metric"><div class="metricName">Buchungen gesamt</div><div class="metricNumber">${state.served}</div></div><div class="metric"><div class="metricName">Verpasste Anfragen</div><div class="metricNumber">${state.missed}</div></div><div class="metric"><div class="metricName">Einnahmen</div><div class="metricNumber">${fmt(state.earned)}</div></div><div class="metric"><div class="metricName">Ausgaben</div><div class="metricNumber">${fmt(state.spent)}</div></div></div><div class="divider"></div><p class="sectionKicker">Ereignisprotokoll</p>${state.log.map(l=>`<div class="logItem"><div class="logTime">Nacht ${l.day} · ${l.time} Uhr</div><div class="logText">${safe(l.text)}</div></div>`).join('')}`;}
function sidebar(){const playing=state.playing,tab=state.tab;return `<aside class="sidebar"><div class="sideTop"><div class="sideHeader"><span class="sideTitle">Betriebszentrale</span><span class="count">${state.waiting.length} offen</span></div><div class="tabs"><button class="tab ${tab==='guests'?'active':''}" data-action="tab" data-tab="guests">Gäste</button><button class="tab ${tab==='team'?'active':''}" data-action="tab" data-tab="team">Team</button><button class="tab ${tab==='history'?'active':''}" data-action="tab" data-tab="history">Chronik</button></div></div><div class="sideContent">${tab==='guests'?guestsPage():tab==='team'?teamPage():historyPage()}</div><div class="sideFooter"><div class="controlRow"><button class="button playBtn" data-action="play">${icon(playing?'pause':'play')}${playing?'Pause':'Nacht starten'}</button><div class="speedGroup">${[1,2,4].map(s=>`<button class="speed ${state.speed===s?'active':''}" data-action="speed" data-speed="${s}" aria-label="Geschwindigkeit ${s}x">${s}×</button>`).join('')}</div></div><div class="progressText"><span>Nacht ${state.day} · ${dayClock()} Uhr</span><span>Schichtende 04:00</span></div><div class="progressTrack"><div style="width:${state.tick/40*100}%"></div></div></div></aside>`;}
function rail(){return `<nav class="rail" aria-label="Räume">${KEYS.map(k=>`<button class="navItem ${state.room===k?'selected':''}" data-action="room" data-room="${k}" title="${ROOM[k].name}">${icon(ROOM[k].icon)}<span>${ROOM[k].short}</span></button>`).join('')}<div class="railBottom"><button class="navItem" data-action="help" title="Hilfe">${icon('help')}<span>Hilfe</span></button></div></nav>`;}
function topbar(){return `<header class="topbar"><div class="brand"><div class="logo">V</div><div><div class="brandName">Velvet Hours</div><div class="brandTag">Eine Nacht. Viele Geschichten.</div></div></div><div class="topstats">${stat('SPIELNACHT','0'+state.day,'gold')}${stat('UHRZEIT',dayClock())}${stat('KASSE',euro(state.cash),state.cash>=0?'green':'')}${stat('RUF',state.reputation+' / 100')}${stat('SICHERHEIT',state.security+' %')}</div><div class="topactions"><button class="iconbtn" data-action="sound" title="Ton ${state.sound?'ausschalten':'einschalten'}">${icon(state.sound?'volume':'mute')}</button><button class="iconbtn" data-action="save" title="Speichern">${icon('save')}</button><button class="iconbtn" data-action="export" title="Spielstand exportieren">${icon('download')}</button><button class="iconbtn" data-action="help" title="Spielanleitung">${icon('help')}</button></div></header>`;}
function eventModal(){const e=EVENTS.find(e=>e.id===state.overlay.eventId);if(!e)return '';return `<div class="modalOverlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalheading"><div class="modalTop"><p class="modalLead">${e.eyebrow} · Zufallsereignis ${state.seenEvents.length}</p><h2 class="modalTitle" id="modalheading">${e.title}</h2><p class="modalText">${e.text}</p></div><div class="modalBody"><p class="sectionKicker">Wie entscheidest du?</p>${e.options.map((o,i)=>`<button class="choice" data-action="event" data-index="${i}" ${state.cash+(o.effects.cash||0)<0?'disabled title="Nicht genügend Guthaben"':''}><span><div class="choiceTitle">${o.label}</div><div class="choiceEffect">${o.subtitle}</div></span><span class="choiceArrow">→</span></button>`).join('')}<p class="detailNote">Das Spiel ist während der Entscheidung angehalten. Deine Wahl hat direkte Auswirkungen auf die Simulation.</p></div></section></div>`;}
function profileModal(){const c=state.characters.find(x=>x.id===state.overlay.id);if(!c)return '';return `<div class="modalOverlay" data-action="close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalheading"><div class="modalTop"><p class="modalLead">Charakterprofil · ${c.age} Jahre</p><h2 class="modalTitle" id="modalheading">${c.name}</h2><p class="modalText">${c.role} · ${c.room==='off'?'In der Pause':ROOM[c.room].name}</p></div><div class="modalBody"><div class="profile"><div class="profileArt">${personArt(c)}</div><div class="profileData"><p>${c.desc}</p>${Object.entries(c.skills).map(([name,val])=>`<div class="skill"><span>${name}</span><b>${'★'.repeat(val)}${'☆'.repeat(5-val)}</b></div>`).join('')}<div class="skill"><span>Energie / Stimmung</span><b>${Math.round(c.energy)}% / ${Math.round(c.mood)}%</b></div></div></div><div class="modalActions"><button class="button secondary" data-action="close">Schließen</button><button class="button" data-action="openTeam">Zum Dienstplan</button></div></div></section></div>`;}
function summaryModal(){const n=state.night,balance=n.earned-n.spent;return `<div class="modalOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalheading"><div class="modalTop"><p class="modalLead">04:00 Uhr · Abrechnung</p><h2 class="modalTitle" id="modalheading">Nacht ${state.day} ist vorbei</h2><p class="modalText">Die Lichter werden gedimmt. Zeit für einen Blick auf das Geschäft und einen neuen Plan für morgen.</p></div><div class="modalBody"><div class="nightSummary"><div class="summaryMetric"><span>Umsatz dieser Nacht</span><b>${euro(n.earned)}</b></div><div class="summaryMetric"><span>Ausgaben dieser Nacht</span><b>${euro(n.spent)}</b></div><div class="summaryMetric"><span>Abgeschlossene Buchungen</span><b>${n.served}</b></div><div class="summaryMetric"><span>Ergebnis</span><b style="color:${balance>=0?'#9ad5b0':'#ee9395'}">${euro(balance)}</b></div></div><p class="detailNote">Gesamtruf: ${state.reputation} · Sicherheit: ${state.security} · Kasse: ${euro(state.cash)} · Gesehene Ereignisse: ${new Set(state.seenEvents).size}/10</p><div class="modalActions"><button class="button" data-action="nextNight">Nächste Nacht vorbereiten →</button></div></div></section></div>`;}
function helpModal(){return `<div class="modalOverlay" data-action="close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalheading"><div class="modalTop"><p class="modalLead">Spielanleitung · Prototyp 0.1</p><h2 class="modalTitle" id="modalheading">Willkommen im Velvet Hours</h2><p class="modalText">Ein erwachsenes 2D-Managementspiel mit vier Innenräumen, sechs Figuren, fünf Gästetypen und zehn Ereignissen.</p></div><div class="modalBody"><p class="detailNote"><b>1. Dienstplan:</b> Im Reiter „Team“ Personal den passenden Bereichen zuordnen.<br><br><b>2. Gäste:</b> Im Reiter „Gäste“ Reservierungen annehmen. Jeder Gästetyp braucht einen bestimmten Raum und ein verfügbares Teammitglied. Buchungen dauern 30 Spielminuten.<br><br><b>3. Simulation:</b> „Nacht starten“ beginnt die Schicht. Pausieren und Tempo 1×, 2× oder 4× sind jederzeit möglich. Alle 15 Spielminuten schreitet die Simulation voran.<br><br><b>4. Entscheidungen:</b> Ereigniskarten halten den Ablauf automatisch an. Wähle einen von zwei Lösungswegen.<br><br><b>5. Wachstum:</b> Räume ausbauen, Personalenergie beachten und die Nacht wirtschaftlich überstehen. Um 04:00 folgt die Abrechnung.<br><br><b>6. Speichern:</b> Automatische lokale Sicherung; oben zusätzlich speichern oder als JSON exportieren. „Neues Spiel“ setzt alles zurück.</p><div class="modalActions"><button class="button secondary" data-action="reset">Neues Spiel</button><button class="button" data-action="close">Spielen</button></div></div></section></div>`;}
function modal(){if(!state.overlay)return '';switch(state.overlay.kind){case 'event':return eventModal();case 'profile':return profileModal();case 'summary':return summaryModal();case 'help':return helpModal();default:return '';}}
function render(){const root=document.getElementById('app');root.innerHTML=`<div class="layout">${topbar()}${rail()}${roomPage()}${sidebar()}</div><div id="toasts" class="toastArea"></div>${modal()}`;drawToasts();}
function runAction(a,el){switch(a){case 'room':switchRoom(el.dataset.room);break;case 'tab':state.tab=el.dataset.tab;store();render();break;case 'book':serve(el.dataset.id);break;case 'upgrade':upgrade();break;case 'play':if(state.tick>=40){nightEnd();render();return;}if(state.overlay)return;state.playing=!state.playing;playTone(state.playing?520:290,.09);store();render();break;case 'speed':state.speed=+el.dataset.speed;store();render();break;case 'profile':state.overlay={kind:'profile',id:el.dataset.id};render();break;case 'close':state.overlay=null;render();break;case 'openTeam':state.overlay=null;state.tab='team';render();break;case 'event':chooseEvent(+el.dataset.index);break;case 'nextNight':nextNight();break;case 'help':state.overlay={kind:'help'};render();break;case 'save':store();notice('Spielstand lokal gespeichert.');break;case 'export':exportSave();break;case 'reset':resetGame();break;case 'sound':state.sound=!state.sound;if(state.sound)playTone(580,.15);store();render();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='assign')return;if(a==='close'&&e.target!==el&&!e.target.closest('.modalActions'))return;runAction(a,el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-action="assign"]');if(el)assignStaff(el.dataset.id,el.value);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay&&state.overlay.kind!=='event'&&state.overlay.kind!=='summary'){state.overlay=null;render();}else if(e.key===' '&&!state.overlay&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();state.playing=!state.playing;store();render();}else if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('workerCard')){e.preventDefault();runAction('profile',e.target);}});
let elapsed=0,last=performance.now();function frame(now){let delta=Math.min(1000,now-last);last=now;if(state.playing&&!state.overlay){elapsed+=delta*state.speed;let runs=0;while(elapsed>=2500&&runs++<4&&state.playing&&!state.overlay){elapsed-=2500;tick();}}requestAnimationFrame(frame);}
// Seed initial guests on a new install so the game is interactive before the clock starts.
if(!state.arrived){for(let i=0;i<3;i++)spawnGuest();log('Das Velvet Hours öffnet zum ersten Mal.');store();}
render();requestAnimationFrame(frame);
})();
</script></body></html>
